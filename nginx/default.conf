# The edge: the only service compose publishes on 8010. Every request to the home finance agent
# passes through here, so a second agent replica needs no port of its own; the upstream name
# is resolved to every replica of the manager service while nginx runs.
upstream manager {
    # Re-resolved through Docker's embedded DNS every `valid`, so a replica added with --scale or
    # recreated by a redeploy takes traffic without an edge restart; the zone is the shared memory
    # that run-time resolution requires.
    zone manager 64k;
    resolver 127.0.0.11 valid=5s;
    server manager:8010 resolve;
    # Idle upstream connections kept for reuse; needs HTTP/1.1 and an empty Connection header below.
    keepalive 16;
}

server {
    # Both families: the compose health check reaches localhost, which Alpine resolves to ::1
    # first, and the image's entrypoint script that would add the IPv6 listen cannot edit this
    # read-only mount.
    listen 8010;
    listen [::]:8010;

    location / {
        proxy_pass http://manager;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Buffering is decided per response: the agent's event stream sends X-Accel-Buffering: no,
        # which nginx honors by default, and a comment every 15 s keeps it inside the default 60 s
        # read timeout.
    }
}
