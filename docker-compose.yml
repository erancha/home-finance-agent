# The home finance agent's replicas, its database, the Redis that joins the replicas' live events
# and the nginx edge the browser reaches it through. The scripts export backend/.env,
# CARD_AGENTS_FILE, the card-agent registry, and HOST_UID/HOST_GID, the user who owns it, before
# calling compose; relative paths resolve from this repo's root.
x-manager-build: &manager-build
  context: .
  dockerfile: backend/Dockerfile

x-manager-env-file: &manager-env-file
  - path: ./backend/.env
    required: true

# Overrides backend/.env: the in-network database address, the registry's mount path and strict
# checkpoint deserialization.
x-manager-env: &manager-env
  DATABASE_URL: postgresql+psycopg://hfm:hfm@db:5432/hfm
  CARD_AGENTS_FILE: /card-agents.yaml
  LANGGRAPH_STRICT_MSGPACK: "true"

services:
  db:
    image: postgres:16
    deploy: { resources: { limits: { memory: 256M } } }
    environment:
      POSTGRES_USER: hfm
      POSTGRES_PASSWORD: hfm
      POSTGRES_DB: hfm
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - hfm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfm -d hfm"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Carries live review events between the manager replicas; nothing is kept, so no volume.
  redis:
    image: redis:7-alpine
    deploy: { resources: { limits: { memory: 64M } } }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    build: *manager-build
    image: hfm-manager:local
    command: alembic upgrade head
    env_file: *manager-env-file
    environment: *manager-env
    depends_on:
      db:
        condition: service_healthy

  manager:
    build: *manager-build
    image: hfm-manager:local
    # The app ends its event streams on SIGTERM; the graceful timeout is a backstop.
    command: >-
      uvicorn hfm.platform.app:create_app --factory --host 0.0.0.0 --port 8010
      --timeout-graceful-shutdown 5
    env_file: *manager-env-file
    environment:
      <<: *manager-env
      # Live events cross the replicas through Redis. To run on the in-process bus instead, blank
      # this value (a blank counts as unset) and set replicas to 1 below: a stream held by a
      # replica other than the one running the review would go quiet after its replay. The redis
      # service may stay; idle, it costs nothing. start.sh --host is that single process,
      # ready-made, with no Redis at all.
      REDIS_URL: redis://redis:6379/0
    # The registry holds the card agents' secrets, so the scripts write it readable by its owner
    # alone; the manager runs as that user to read the mount. The image's own user serves migrate.
    user: "${HOST_UID:?run through ./scripts/start.sh}:${HOST_GID:?same}"
    # A card agent on this machine is registered as http://host.docker.internal:<port>; this alias
    # gives a plain Linux Docker Engine that name, which Docker Desktop provides on its own.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CARD_AGENTS_FILE:?run through ./scripts/start.sh}:/card-agents.yaml:ro
    # More than one replica shows a review served by whichever one takes each request; the edge
    # spreads requests over all and picks up replicas added or recreated while the stack runs.
    # Redeploy only while every review is waiting or completed: a replica that boots fails every
    # running review, whoever runs it. To try another count without editing this file, scale the
    # running stack from a shell that sourced scripts/common.sh and ran load_env (the compose
    # interpolation needs its exports): `compose up -d --scale manager=N --wait`. The next
    # start.sh returns to this count.
    deploy: { replicas: 2, resources: { limits: { memory: 512M } } }
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The only service that publishes the agent's port; nginx/default.conf proxies to the manager.
  edge:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    deploy: { resources: { limits: { memory: 64M } } }
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8010/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      manager:
        condition: service_healthy

volumes:
  hfm_pgdata:
