# The home finance agent's replicas, its database, the Redis that joins the replicas' live events
# and the nginx edge the browser reaches it through. The scripts call compose from this directory,
# so relative paths resolve from the repo root. Settings come from the files under scripts/lib/
# (stack-params.sh, params.sh, secrets.sh), which the scripts export into their shell before
# calling compose, so the ${...} values below interpolate; a bare docker compose call has none of
# them. Postgres binds to this machine's loopback interface only, since Docker otherwise
# publishes on every host interface and exposes the port to the whole network; the edge is the
# deliberate exception.
#
# Nothing is bind-mounted from this machine, so the same file runs against the EC2 instance's
# Docker daemon (docker-compose.ec2.yml): the edge's configuration is baked into its own image,
# and the card-agent registry reaches the manager as a secret.
name: home-finance-agent

x-manager-build: &manager-build
  context: .
  dockerfile: backend/Dockerfile

x-manager-image: &manager-image hfm-manager:local

# The in-network address, overriding the host form secrets.sh holds.
x-database-env: &database-env
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?set in stack-params.sh}:\
    ${POSTGRES_PASSWORD:?set in secrets.sh}@db:${DB_PORT:?set in stack-params.sh}/\
    ${POSTGRES_DB:?set in stack-params.sh}"

# Each container receives only the settings it reads, listed once per service below. A key
# listed without a value takes its value from the scripts' shell and stays unset when its settings
# file leaves it commented out, so the service keeps its default.
x-manager-env: &manager-env
  <<: *database-env
  LLM_MODEL:
  LLM_API_KEY:
  GOOGLE_CLIENT_ID:
  AUTH_ISSUER:
  AUTH_JWKS_URL:
  AUTH_PUBLIC_KEY_FILE:
  HFM_E2E:
  HFM_HTTPS_ONLY:
  REPORT_MEMORY_RETENTION_DAYS:
  HFM_LOG_LEVEL:
  HFM_LOG_LEVELS:
  # Where the card-agents secret below is placed.
  CARD_AGENTS_FILE: /run/secrets/card-agents
  # Live events cross the replicas through Redis. To run on the in-process bus instead, blank
  # this value (a blank counts as unset) and set replicas to 1 below: a stream held by a replica
  # other than the one running the review would go quiet after its replay. The redis service may
  # stay; idle, it costs nothing.
  REDIS_URL: redis://redis:6379/0
  # Strict checkpoint deserialization: any value type outside the review's allow-list is refused.
  LANGGRAPH_STRICT_MSGPACK: "true"

# The card agents the manager calls, with the secrets they issued to it. compose() of
# scripts/common.sh exports the registry file's content as CARD_AGENTS_REGISTRY. Compose copies a
# secret taken from a variable into the container when it creates it, so no file of this machine
# is mounted; docker-compose.ec2.yml hands the instance's manager the instance's registry instead.
secrets:
  card-agents:
    environment: CARD_AGENTS_REGISTRY

services:
  db:
    image: postgres:16
    deploy: { resources: { limits: { memory: 256M } } }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in stack-params.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in secrets.sh}
      POSTGRES_DB: ${POSTGRES_DB:?set in stack-params.sh}
      # Moves the server, and pg_isready below, off the default port.
      PGPORT: ${DB_PORT:?set in stack-params.sh}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?set in stack-params.sh}:${DB_PORT:?set in stack-params.sh}"
    volumes:
      - hfm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Carries live review events between the manager replicas; nothing is kept, so no volume.
  redis:
    image: redis:7-alpine
    deploy: { resources: { limits: { memory: 64M } } }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Brings the schema and the checkpoint tables to the image's version, then exits.
  migrate:
    build: *manager-build
    image: *manager-image
    command: alembic upgrade head
    environment: *database-env
    depends_on:
      db:
        condition: service_healthy

  manager:
    build: *manager-build
    image: *manager-image
    # The app ends its event streams on SIGTERM; the graceful timeout is a backstop.
    command: >-
      uvicorn hfm.platform.app:create_app --factory --host 0.0.0.0 --port 8010
      --timeout-graceful-shutdown 5
    environment: *manager-env
    # Readable by everyone in the container, which runs only the image's own user.
    secrets:
      - card-agents
    # A card agent on the same machine, or on the same EC2 instance, is registered as
    # http://host.docker.internal:<port>; this alias gives a plain Linux Docker Engine that name,
    # which Docker Desktop provides on its own.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # More than one replica shows a review served by whichever one takes each request; the edge
    # spreads requests over all and picks up replicas added or recreated while the stack runs.
    # A redeploy fails only the reviews running on the replicas it stops; a review another replica
    # runs goes on, and a waiting review needs no replica. To try another count without editing
    # this file, scale the running stack from a shell that sourced scripts/common.sh (compose
    # loads the settings it interpolates): `compose up -d --scale manager=N --wait`. The next
    # deploy.sh returns to this count.
    deploy: { replicas: 2, resources: { limits: { memory: 512M } } }
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The only service that publishes the agent's port; nginx/default.conf, baked into the image,
  # proxies to the manager.
  edge:
    build:
      context: nginx
      dockerfile_inline: |
        FROM nginx:1.28-alpine
        COPY default.conf /etc/nginx/conf.d/default.conf
    image: hfm-edge:local
    deploy: { resources: { limits: { memory: 64M } } }
    ports:
      - "${EDGE_HOST_PORT:?set in stack-params.sh}:8010"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8010/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      manager:
        condition: service_healthy

volumes:
  hfm_pgdata:
