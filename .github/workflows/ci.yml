name: ci

on:
  push:
  pull_request:

# Both jobs run scripts/test.sh, the same entry point developers use locally, so CI and local
# verification cannot drift. The script provisions its own backend virtualenv and frontend deps.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The python:3.14-slim image the home finance agent ships on, so the suite runs on the
          # interpreter and the pins of the container; backend/pyproject.toml keeps 3.12 as the
          # floor for other machines.
          python-version: "3.14"
      # ruff, mypy, import-linter contracts and pytest; the Postgres tests start a Testcontainers
      # database on the runner's Docker.
      - name: Backend tests
        run: bash scripts/test.sh backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # tsc, oxlint, vitest and the production build.
      - name: Frontend checks
        run: bash scripts/test.sh frontend
