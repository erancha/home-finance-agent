[project]
name = "hfm"
version = "0.1.0"
description = "Home finance agent: a LangGraph review over A2A card agents"
license = "MIT"
authors = [{ name = "Eran C", email = "erancha@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary,pool]>=3.3",
    "alembic>=1.20",
    "structlog>=26",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    "a2a-sdk>=1.2.2,<2",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "PyJWT[crypto]>=2.10",
    "redis>=6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "import-linter>=2.15",
    "testcontainers>=4.15",
    "ruff>=0.17,<0.18",
    "mypy>=2.4",
    "types-PyYAML>=6",
    "pip-tools>=7.6",
    "packaging>=24",
    "jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]

[tool.mypy]
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["a2a.*", "google.protobuf.*", "langgraph.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["hfm"]
include_external_packages = true

# platform composes everything; application uses ports and domain; adapters implement ports.
[[tool.importlinter.contracts]]
name = "Layers: platform over application over ports over domain"
type = "layers"
layers = ["hfm.platform", "hfm.application", "hfm.ports", "hfm.domain"]

[[tool.importlinter.contracts]]
name = "Adapters implement ports and never reach application or platform"
type = "forbidden"
source_modules = ["hfm.adapters"]
forbidden_modules = ["hfm.application", "hfm.platform"]

[[tool.importlinter.contracts]]
name = "Inner layers are framework free"
type = "forbidden"
source_modules = ["hfm.domain", "hfm.ports", "hfm.application"]
forbidden_modules = ["a2a", "fastapi", "starlette", "sqlalchemy", "psycopg", "langchain",
    "langchain_core", "langchain_anthropic", "langchain_openai", "httpx", "yaml", "structlog"]

# The graph is the one module below the platform allowed to depend on the orchestration library.
[[tool.importlinter.contracts]]
name = "Only the review graph imports langgraph below the platform"
type = "forbidden"
source_modules = ["hfm.domain", "hfm.ports", "hfm.application"]
forbidden_modules = ["langgraph"]
ignore_imports = [
    "hfm.application.review_graph -> langgraph",
]
